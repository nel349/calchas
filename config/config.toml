# Calchas Configuration File
# Phase 1-2: Strategy loading + Kalshi API integration
# Future phases will add: [database], [web], [logging], [risk]

# =============================================================================
# RUNTIME CONFIGURATION
# =============================================================================

[runtime]
# Directory containing strategy JSON files
# Can be overridden with: CALCHAS__RUNTIME__STRATEGY_DIR
strategy_dir = "strategies/"

# Default minimum time to event in minutes (when strategy doesn't specify)
# Can be overridden with: CALCHAS__RUNTIME__DEFAULT_MIN_TIME_MINUTES
# Default: 0 (allow live events)
default_min_time_minutes = 0

# Default maximum time to event in minutes (when strategy doesn't specify)
# Can be overridden with: CALCHAS__RUNTIME__DEFAULT_MAX_TIME_MINUTES
# Default: 43200 (30 days)
default_max_time_minutes = 43200


# =============================================================================
# KALSHI API CONFIGURATION (Phase 2)
# =============================================================================

[kalshi]
# Use demo API (true) or production API (false)
# Can be overridden with: CALCHAS__KALSHI__USE_DEMO
use_demo = true

# API credentials MUST be set via environment variables (NEVER commit to git!)
# Set these in .env file or shell:
#
# CALCHAS__KALSHI__API_KEY_ID=your-key-id-from-kalshi-dashboard
# CALCHAS__KALSHI__PRIVATE_KEY="-----BEGIN RSA PRIVATE KEY-----\nMIIEow...\n-----END RSA PRIVATE KEY-----"
#
# Note: The private_key must be a PEM-encoded RSA key with newlines escaped as \n
# Kalshi provides PKCS#1 format (-----BEGIN RSA PRIVATE KEY-----)
# Both PKCS#1 and PKCS#8 formats are supported
# Get your credentials from: https://demo.kalshi.com/account/api-keys (demo)
#                        or: https://elections.kalshi.com/account/api-keys (production)

# These fields are required but must come from environment variables for security
api_key_id = ""      # Set via CALCHAS__KALSHI__API_KEY_ID
private_key = ""     # Set via CALCHAS__KALSHI__PRIVATE_KEY


