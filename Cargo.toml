[package]
name = "calchas"
version = "0.1.0"
edition = "2024"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Precise decimal math (no floats for money!)
rust_decimal = { version = "1.33", features = ["serde"] }
rust_decimal_macros = "1.33"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }

# Configuration
config = "0.15.19"
dotenvy = "0.15"  # Load .env files

# HTTP client (Kalshi API)
reqwest = { version = "0.11", features = ["json"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# RSA cryptography for Kalshi API signatures
rsa = "0.9"
sha2 = "0.10"
base64 = "0.21"
pem = "3.0"
rand = "0.8"

[dev-dependencies]
# Temporary files for testing
tempfile = "3.8"

# Serialize tests that modify global state (env vars)
serial_test = "3.0"
